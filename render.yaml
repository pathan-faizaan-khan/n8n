services:
  - type: web
    name: n8n-free-service
    # Corrected: runtime must be set to 'image' for pre-built Docker containers
    runtime: image
    plan: free
    # Corrected: property name is 'image' instead of 'imageRepo'
    image: docker.n8n.io/n8nio/n8n:latest
    envVars:
      # Corrected: Port mapping for Render must be specified as an envVar
      - key: PORT
        value: "5678"

      # Database Configuration (Supabase)
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        sync: false
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
      - key: DB_POSTGRESDB_USER
        value: postgres
      - key: DB_POSTGRESDB_PASSWORD
        sync: false

      # n8n General Settings
      - key: N8N_HOST
        sync: false 
      - key: WEBHOOK_URL
        sync: false 
      
      # Encryption Key
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
