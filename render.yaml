services:
  - type: web
    name: n8n-free-service
    runtime: image
    plan: free
    image:
      # Corrected URL format pointing directly to Docker Hub
      url: docker.io/n8nio/n8n:latest
    envVars:
      - key: PORT
        value: "5678"

      # Database Configuration (Supabase)
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        sync: false
      - key: DB_POSTGRESDB_PORT
        value: false
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
      - key: DB_POSTGRESDB_USER
        value: postgres
      - key: DB_POSTGRESDB_PASSWORD
        sync: false

      # n8n General Settings
      - key: N8N_HOST
        sync: false 
      - key: WEBHOOK_URL
        sync: false 
      
      # Encryption Key
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
